<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="課題の締め切りを刻むエディトリアルなトラッカー" />
  <title>DEADLINE</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <div class="orbit" aria-hidden="true"></div>

  <header class="head">
    <div class="mark" id="mark" aria-label="DEADLINE"></div>
    <div class="clock" id="clock"></div>
  </header>

  <main class="main">
    <!-- HERO: most urgent task, big and alive -->
    <section class="hero" id="hero" aria-live="polite"></section>

    <div class="rule" aria-hidden="true"></div>

    <div class="list-head">
      <span class="list-label" id="list-label">UPCOMING</span>
      <div class="toggles" id="toggles">
        <button class="tg on" data-filter="active">進行中</button>
        <button class="tg" data-filter="done">完了</button>
        <button class="tg" data-filter="all">全部</button>
      </div>
    </div>

    <ul class="list" id="list"></ul>

    <button class="add" id="add">
      <span class="add-plus">＋</span><span>新しい課題を刻む</span>
    </button>
  </main>

  <!-- editor sheet -->
  <div class="backdrop" id="backdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="grip"></div>
    <h2 id="sheet-title" class="sheet-title">新しい課題</h2>
    <form id="form" autocomplete="off">
      <label class="field" style="--d:1">
        <span>課題名</span>
        <input type="text" id="f-title" placeholder="レポート提出" required maxlength="80" />
      </label>
      <label class="field" style="--d:2">
        <span>科目・タグ</span>
        <input type="text" id="f-subject" placeholder="統計学" maxlength="40" />
      </label>
      <div class="row" style="--d:3">
        <label class="field">
          <span>締切日</span>
          <input type="date" id="f-date" required />
        </label>
        <label class="field">
          <span>時刻</span>
          <input type="time" id="f-time" value="23:59" required />
        </label>
      </div>
      <div class="swatches" id="swatches" style="--d:4" aria-label="カラー">
        <button type="button" class="sw" data-color="violet" style="--sw:#9b8cff"></button>
        <button type="button" class="sw" data-color="cyan" style="--sw:#4ad0c8"></button>
        <button type="button" class="sw" data-color="lime" style="--sw:#bfe04a"></button>
        <button type="button" class="sw" data-color="amber" style="--sw:#f0a73c"></button>
        <button type="button" class="sw" data-color="rose" style="--sw:#f2719b"></button>
      </div>
      <div class="actions" style="--d:5">
        <button type="button" class="btn del" id="del-btn" hidden>削除</button>
        <button type="button" class="btn ghost" id="cancel-btn">やめる</button>
        <button type="submit" class="btn solid" id="save-btn">刻む</button>
      </div>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
