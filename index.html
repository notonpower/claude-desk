<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="課題の締め切りを刻むエディトリアルなトラッカー" />
  <title>DEADLINE</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=7" />
  <script>
    // set theme before paint to avoid flash
    (function () {
      try {
        var t = localStorage.getItem("deadline.theme");
        if (!t) t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", t === "light" ? "#f3f0e8" : "#0b0b0d");
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <div class="orbit" aria-hidden="true"></div>

  <header class="head">
    <div class="mark" id="mark" aria-label="DEADLINE"></div>
    <div class="head-right">
      <div class="clock" id="clock"></div>
      <button class="theme" id="theme" aria-label="テーマ切替"></button>
    </div>
  </header>

  <main class="main">
    <section class="hero" id="hero" aria-live="polite"></section>

    <div class="rule" aria-hidden="true"></div>

    <div class="list-head">
      <button class="sort" id="sort-btn"><span id="sort-label">締切順</span> <span class="sort-ic">⇅</span></button>
      <div class="toggles" id="toggles">
        <button class="tg on" data-filter="active">進行中</button>
        <button class="tg" data-filter="done">完了</button>
        <button class="tg" data-filter="all">全部</button>
      </div>
    </div>

    <ul class="list" id="list"></ul>

    <button class="add" id="add">
      <span class="add-plus">＋</span><span>新しい課題を刻む</span>
    </button>

    <footer class="ver">DEADLINE — build 7</footer>
  </main>

  <!-- editor sheet -->
  <div class="backdrop" id="backdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="grip"></div>
    <h2 id="sheet-title" class="sheet-title">新しい課題</h2>
    <form id="form" autocomplete="off">
      <div class="block" style="--d:1">
        <label class="field">
          <span>課題名</span>
          <input type="text" id="f-title" placeholder="レポート提出" required maxlength="80" />
        </label>
        <div class="quick" id="title-quick">
          <button type="button" class="q" data-fill="レポート">レポート</button>
          <button type="button" class="q" data-fill="リアクションペーパー">リアぺ</button>
          <button type="button" class="q" data-fill="小テスト">小テスト</button>
          <button type="button" class="q" data-fill="定期テスト勉強">定期テスト勉強</button>
          <button type="button" class="q" data-fill="課題提出">課題提出</button>
          <button type="button" class="q" data-fill="予習・復習">予習・復習</button>
          <button type="button" class="q" data-fill="プレゼン準備">プレゼン準備</button>
        </div>
      </div>

      <div class="block" style="--d:2">
        <label class="field">
          <span>科目・タグ</span>
          <input type="text" id="f-subject" placeholder="統計学" maxlength="40" />
        </label>
        <div class="quick" id="subject-quick" hidden></div>
      </div>

      <div class="block" style="--d:3">
        <span class="block-label">締切</span>
        <div class="quick" id="date-quick">
          <button type="button" class="q" data-when="today">今日</button>
          <button type="button" class="q" data-when="tomorrow">明日</button>
          <button type="button" class="q" data-when="weekend">今週末</button>
          <button type="button" class="q" data-when="nextweek">来週</button>
        </div>
        <div class="row">
          <label class="mini"><span>日付</span><input type="date" id="f-date" required /></label>
          <label class="mini"><span>時刻</span><input type="time" id="f-time" value="23:59" required /></label>
        </div>
      </div>

      <div class="block" style="--d:4">
        <span class="block-label">優先度</span>
        <div class="seg" id="prio-seg">
          <button type="button" data-prio="low">低</button>
          <button type="button" data-prio="normal" class="on">中</button>
          <button type="button" data-prio="high">高</button>
        </div>
      </div>

      <div class="block" style="--d:5">
        <span class="block-label">繰り返し</span>
        <div class="quick" id="repeat-seg">
          <button type="button" class="q on" data-rep="none">なし</button>
          <button type="button" class="q" data-rep="daily">毎日</button>
          <button type="button" class="q" data-rep="weekly">毎週</button>
          <button type="button" class="q" data-rep="biweekly">隔週</button>
          <button type="button" class="q" data-rep="monthly">毎月</button>
        </div>
      </div>

      <div class="block" style="--d:6">
        <span class="block-label">カラー</span>
        <div class="swatches" id="swatches" aria-label="カラー">
          <button type="button" class="sw" data-color="violet" style="--sw:#9b8cff"></button>
          <button type="button" class="sw" data-color="cyan" style="--sw:#4ad0c8"></button>
          <button type="button" class="sw" data-color="lime" style="--sw:#bfe04a"></button>
          <button type="button" class="sw" data-color="amber" style="--sw:#f0a73c"></button>
          <button type="button" class="sw" data-color="rose" style="--sw:#f2719b"></button>
        </div>
      </div>

      <button type="button" class="btn cal" id="cal-btn" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
        カレンダーに登録 (.ics)
      </button>

      <div class="actions" style="--d:7">
        <button type="button" class="btn del" id="del-btn" hidden>削除</button>
        <button type="button" class="btn ghost" id="cancel-btn">やめる</button>
        <button type="submit" class="btn solid" id="save-btn">刻む</button>
      </div>
    </form>
  </div>

  <script src="app.js?v=7"></script>
</body>
</html>
